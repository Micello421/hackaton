<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Księżyc</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Georgia, serif;
      color: #f4f1ea;
      background:
        radial-gradient(circle at 70% 20%, #3a3f5c 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, #1b2438 0%, transparent 40%),
        #070b14;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    .moon {
      width: 7.5rem;
      height: 7.5rem;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff8e7, #d9d2c5 45%, #9e9788 100%);
      box-shadow:
        0 0 40px rgba(255, 245, 210, 0.35),
        inset -18px -10px 0 rgba(7, 11, 20, 0.18);
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 0 0.9rem;
      line-height: 1.55;
      color: #c9c4b8;
      font-size: 1.05rem;
    }
    .tag {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b93a7;
    }
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true"></div>
    <h1>Księżyc</h1>
    <p>Naturalny satelita Ziemi — jedyny, który stale widzimy gołym okiem na nocnym niebie.</p>
    <p>Wpływa na pływy oceanów i od wieków pomaga ludziom mierzyć czas oraz nawigować.</p>
    <p>Jego jasna tarcza to głównie skalisty pył i kratery po uderzeniach sprzed miliardów lat.</p>
    <div class="tag">hackaton · test kandev/git</div>
  </main>
</body>
</html>
